[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcside-companion"
version = "0.2.0"
description = "Explicitly opt-in local Python execution and development bridge for Arcside Labs"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
ide = ["debugpy>=1.8,<2", "python-lsp-server[all]>=1.12,<2", "ruff>=0.8,<1", "black>=24,<27", "pytest>=8,<10"]
notebook = ["jupyter-client>=8,<9", "ipykernel>=6,<8"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "websockets>=12,<16"]
all = ["debugpy>=1.8,<2", "python-lsp-server[all]>=1.12,<2", "ruff>=0.8,<1", "black>=24,<27", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "jupyter-client>=8,<9", "ipykernel>=6,<8", "httpx>=0.27,<1"]

[project.scripts]
arcside-companion = "arcside_companion.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arcside_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
