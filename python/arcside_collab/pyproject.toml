[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcside-collab"
version = "0.1.0"
description = "Authenticated persistent live collaboration for Arcside Sheets"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
arcside-collab = "arcside_collab.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arcside_collab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
