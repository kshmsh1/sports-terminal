<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcside · Excel Workspace</title>
<style>
:root{--green:#107c41;--dark:#153c2b;--line:#d7dde3;--text:#262b33;--muted:#707a87;--head:#f2f4f7;--canvas:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:13px/1.42 "Aptos",Calibri,Arial,sans-serif;color:var(--text);background:#f6f7f8}
button,input,select{font:inherit}button{background:transparent;border:1px solid transparent;color:inherit;padding:5px 10px;cursor:pointer;border-radius:3px}
button:hover{background:#e6ece8;border-color:#cbd6d0}button.active{background:#d1ebde;color:#11653c;border-color:#bad8c9}
input,select{background:#fff;color:var(--text);border:1px solid var(--line);padding:6px;border-radius:2px}
input:focus{outline:2px solid #75b69a;outline-offset:-1px}
.shell{height:100vh;display:grid;grid-template-rows:42px 38px 95px 37px minmax(0,1fr) 37px 24px;min-width:430px}
.top{background:var(--green);color:white;display:flex;align-items:center;gap:10px;padding:0 14px}
.top strong{font-size:16px}.top input{background:#176a41;color:white;border-color:#32885a;font-size:13px;max-width:250px}
.top input::placeholder{color:#d4f0de}.top .spacer{flex:1}.top button{color:white;border-color:#3b9262}.top button:hover{background:#278a54}
.menutabs{display:flex;gap:2px;align-items:stretch;padding:0 10px;background:#f7f8f7;border-bottom:1px solid var(--line)}
.menutabs button{border-radius:0;padding:7px 13px}.menutabs button.active{background:white;color:#11683d;border-bottom:3px solid #0f7c41;border-top:0;border-left:0;border-right:0}
.ribbon{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:9px 12px;overflow-x:auto}
.ribbon .group{display:flex;align-items:center;gap:3px;padding:0 12px;border-right:1px solid var(--line);height:76px;flex-shrink:0}
.ribbon .group small{color:var(--muted);display:block;letter-spacing:.2px;font-size:10px}.ribbon .group .stack{display:flex;flex-direction:column;align-items:center;gap:3px}
.ribbon button{min-width:30px;padding:7px 6px;font-size:14px}.ribbon select{max-width:100px}
.formula{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:5px 10px}
#nameBox{width:85px;text-align:center;font-weight:bold}#formulaInput{flex:1;min-width:50px;border-color:transparent}#formulaInput:focus{border-color:#6da886}
.formula b{color:#9ea7b2;font-style:italic;font-family:Georgia,serif}
.area{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#colHeaders{position:absolute;left:49px;right:0;top:0;height:27px;background:var(--head);overflow:hidden;border-bottom:1px solid var(--line)}
#rowHeaders{position:absolute;top:27px;bottom:0;left:0;width:49px;background:var(--head);overflow:hidden;border-right:1px solid var(--line)}
.corner{height:27px;width:49px;position:absolute;top:0;left:0;background:#e9edf1;z-index:5;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#gridViewport{position:absolute;left:49px;top:27px;right:0;bottom:0;overflow:auto;background:var(--canvas);outline:none}
#spacer{position:relative;width:65000px;height:2800000px}
#cellsLayer{position:absolute;left:0;top:0;pointer-events:none}
.cell{position:absolute;height:27px;line-height:26px;padding:0 6px;border-right:1px solid #e5e8ed;border-bottom:1px solid #e5e8ed;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;pointer-events:auto;background:#fff;font-size:13px}
.cell.number{text-align:right}.cell.selected{outline:2px solid var(--green);outline-offset:-2px;z-index:2}
.cell.range{background:#d8f0e4}.cell.range.selected{background:#fff}
.cell.error{color:#bb3030}.cell.bold{font-weight:bold}.cell.italic{font-style:italic}
.cell.center{text-align:center}.cell.right{text-align:right}
.ch{position:absolute;top:0;height:27px;line-height:26px;border-right:1px solid var(--line);text-align:center;background:var(--head);user-select:none;font-size:12px;font-weight:600;cursor:default}
.ch.active,.rh.active{background:#d8eee0;color:#117544}
.rh{position:absolute;left:0;width:49px;height:27px;line-height:26px;text-align:center;border-bottom:1px solid var(--line);user-select:none;font-size:12px;font-weight:600;background:var(--head)}
.resize{position:absolute;right:0;top:0;width:5px;height:100%;cursor:col-resize}
#cellEdit{position:absolute;display:none;z-index:20;box-shadow:0 0 0 2px var(--green);background:white;outline:none;border:0;margin:0;padding:2px 6px;height:27px;min-width:50px;font:13px/22px Calibri,Arial,sans-serif;color:var(--text)}
#selection{position:absolute;display:none;border:2px solid var(--green);pointer-events:none;z-index:9}
#selection::after{content:"";position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--green)}
.sheets{display:flex;align-items:center;background:#eef1f3;border-top:1px solid var(--line);padding:0 12px;gap:4px;overflow-x:auto}
.sheets button{padding:8px 16px;border-radius:0;white-space:nowrap}.sheets button.active{background:white;color:var(--green);border:0;border-bottom:3px solid var(--green);font-weight:700}
.sheets .spacer{flex:1}.status{display:flex;align-items:center;gap:14px;background:#eceff1;color:#59616c;padding:0 15px;font-size:11px}.status .spacer{flex:1}
#chartPanel{position:absolute;right:22px;top:30px;width:530px;max-width:calc(100% - 44px);background:white;border:1px solid #b2bcc6;box-shadow:0 20px 60px #0003;z-index:30;padding:15px;display:none}
#chartPanel h3{margin:0 0 8px}#chart{width:100%;height:270px;display:block}#chartPanel .controls{display:flex;align-items:center;gap:8px;justify-content:space-between}
#toast{position:absolute;bottom:54px;right:20px;background:#23392e;color:white;padding:10px 16px;border-radius:6px;display:none;z-index:50}
@media(max-width:760px){.shell{grid-template-rows:42px 38px 68px 37px minmax(0,1fr) 37px 24px}.ribbon{padding:4px}.ribbon .group{height:60px;padding:0 7px}.top .optional,.status .optional{display:none}}
</style>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module" src="./app.mjs"></script>
</head><body><div class="shell">
<div class="top"><strong>Arcside</strong><span> / Excel Workspace</span><input id="workbookName" value="Untitled workbook" aria-label="Workbook name"><span class="spacer"></span><span class="optional">Saved locally · no paid APIs</span><button id="import">Open</button><button id="export">Export</button><input type="file" id="fileInput" accept=".csv,.tsv,.xlsx,.xls,.json" hidden></div>
<div class="menutabs"><button class="active" data-menu="Home">Home</button><button data-menu="Insert">Insert</button><button data-menu="Formulas">Formulas</button><button data-menu="Data">Data</button><button data-menu="View">View</button></div>
<div class="ribbon">
<div class="group"><div class="stack"><button id="undo" title="Undo Ctrl+Z">↶</button><small>Undo</small></div><div class="stack"><button id="redo" title="Redo Ctrl+Y">↷</button><small>Redo</small></div></div>
<div class="group"><div class="stack"><button id="bold"><b>B</b></button><small>Bold</small></div><div class="stack"><button id="italic"><i>I</i></button><small>Italic</small></div><div class="stack"><button id="align" title="Toggle cell alignment">≡</button><small>Align</small></div></div>
<div class="group"><div class="stack"><select id="format" aria-label="Number format"><option value="general">General</option><option value="number">Number</option><option value="currency">Currency</option><option value="percent">Percent</option></select><small>Number</small></div></div>
<div class="group"><div class="stack"><button id="sum">Σ AutoSum</button><small>Functions</small></div><div class="stack"><button id="insertRow">+ Row</button><small>Insert</small></div><div class="stack"><button id="insertColumn">+ Column</button><small>Insert</small></div></div>
<div class="group"><div class="stack"><button id="sortAsc">A → Z</button><small>Sort</small></div><div class="stack"><button id="sortDesc">Z → A</button><small>Sort</small></div><div class="stack"><button id="filter">Filter</button><small>Data</small></div></div>
<div class="group"><div class="stack"><button id="barChart">▥ Bar</button><small>Chart</small></div><div class="stack"><button id="lineChart">⌁ Line</button><small>Chart</small></div><div class="stack"><button id="pieChart">◕ Pie</button><small>Chart</small></div></div>
<div class="group"><div class="stack"><button id="copy">Copy</button><small>Clipboard</small></div><div class="stack"><button id="paste">Paste</button><small>Clipboard</small></div></div>
</div>
<div class="formula"><input id="nameBox" value="A1" aria-label="Cell address"><b>fx</b><input id="formulaInput" placeholder="Enter a value or an Excel-style formula" aria-label="Formula bar"></div>
<div class="area" id="area"><div class="corner"></div><div id="colHeaders"></div><div id="rowHeaders"></div><div id="gridViewport" tabindex="0"><div id="spacer"><div id="cellsLayer"></div></div></div><input id="cellEdit" autocomplete="off" spellcheck="false">
<div id="chartPanel"><div class="controls"><h3>Chart</h3><div><select id="chartType"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option><option value="scatter">Scatter</option></select><button id="closeChart">×</button></div></div><canvas id="chart" width="980" height="540"></canvas><button id="downloadChart">Download PNG</button></div><div id="toast"></div></div>
<div class="sheets"><button id="addSheet" title="New sheet">＋</button><div id="sheetTabs" style="display:flex;gap:3px"></div><button id="renameSheet" title="Rename selected sheet">✎</button><button id="deleteSheet" title="Delete selected sheet">×</button><span class="spacer"></span><span style="font-size:11px">100,000 rows · 512 columns</span></div>
<div class="status"><span id="selectedInfo">Ready</span><span id="calcInfo">Automatic calculation</span><span class="spacer"></span><span class="optional">Ctrl+C / Ctrl+V · Ctrl+Z · F2</span><span>100%</span></div>
</div></body></html>
