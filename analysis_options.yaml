# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Existing UI code still uses deprecated DropdownButtonFormField.value in
    # several prototype screens. Keep this non-blocking until those screens are
    # refreshed as part of the UI modernization pass.
    deprecated_member_use: ignore
    # Legacy prototype screens may keep intermediate computed values while a
    # panel is being wired. Product validation should not fail on these.
    unused_local_variable: ignore

linter:
  rules:
    # Repository tools are command-line validators/importers and intentionally
    # write concise progress output.
    avoid_print: false
