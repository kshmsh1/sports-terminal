# Static analysis and lint configuration for Sports Terminal.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # This API remains in several active prototype controls and will be
    # migrated during the next component modernization pass.
    deprecated_member_use: ignore
    # A small number of legacy screen-local design tokens remain while the
    # connected customer surfaces replace their prototype predecessors. This
    # does not suppress type, null-safety, or runtime correctness diagnostics.
    unused_element: ignore
    # The restored static website screens include one private metric schema
    # exposed through file-local top-level builders. This is a visibility/style
    # diagnostic only; the schema never crosses a library boundary at runtime.
    library_private_types_in_public_api: ignore
    # One restored table helper keeps an optional width hook for parity with the
    # original table component even though the current call sites use default
    # width. Keep the hook without turning a style-only warning into CI failure.
    unused_element_parameter: ignore

linter:
  rules:
    # Repository command-line validators and importers intentionally
    # print concise progress output.
    avoid_print: false
    # Dart 3.12 flags conventional (_, __) callback placeholders. Existing
    # terminal screens use the second underscore only to distinguish two
    # intentionally unused callback parameters; this is formatting/style only.
    unnecessary_underscores: false
    # Compact list-building helpers in restored static website widgets use
    # single-statement for loops; this has no semantic/runtime effect.
    curly_braces_in_flow_control_structures: false
