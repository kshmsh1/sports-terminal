# Static analysis and lint configuration for Sports Terminal.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # This API remains in several active prototype controls and will be
    # migrated during the next component modernization pass.
    deprecated_member_use: ignore
    # A small number of legacy screen-local design tokens remain while the
    # connected customer surfaces replace their prototype predecessors. This
    # does not suppress type, null-safety, or runtime correctness diagnostics.
    unused_element: ignore

linter:
  rules:
    # Repository command-line validators and importers intentionally
    # print concise progress output.
    avoid_print: false
    # Flutter callbacks frequently use multiple intentionally ignored positional
    # arguments. Treating those wildcard parameters as an error adds no product
    # safety and makes generated/list-builder code less readable.
    unnecessary_underscores: false
