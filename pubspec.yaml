name: sports_terminal
description: A zero-cost, NBA-first historical sports terminal built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/nba/README.md
    - assets/data/nba/metadata/dataset_manifest.json
    - assets/data/nba/teams/teams.json
    - assets/data/nba/seasons/seasons.json
    - assets/data/nba/players/player_profiles.json
    - assets/data/nba/players/player_aliases.json
    - assets/data/nba/stats/player_traditional_by_season.json
    - assets/data/nba/stats/team_by_season.json
    - assets/data/nba/games/game_records.json
    - assets/data/nba/rosters/roster_entries.json
    - assets/data/nba/awards/award_records.json
    - assets/data/nba/draft/draft_picks.json
    - assets/data/nba/transactions/transaction_records.json
    - assets/data/nba/standings/standings_records.json
    - assets/data/nba/playoffs/playoff_series_records.json
    - assets/data/nba/terminal_seed/nba_2025/
