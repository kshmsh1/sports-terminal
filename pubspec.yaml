name: sports_terminal
description: "A zero-cost, NBA-first historical sports terminal built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/nba/README.md
    - assets/data/nba/metadata/dataset_manifest.json
    - assets/data/nba/teams/teams.json
    - assets/data/nba/seasons/seasons.json
