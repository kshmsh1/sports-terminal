name: Stats Catalog Repair

on:
  push:
    branches: [agent/stats-workstation-visual-and-metric-overhaul]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stats-workstation-visual-and-metric-overhaul
      - name: Collapse duplicate anticipation definitions and verify catalog
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          path = Path('lib/services/nba_stats_metric_catalog.dart')
          text = path.read_text()
          line = "  _m('anticipation', 'Defensive Anticipation', 'ANTICIP', 'Defense', 'Model or tracking estimate of how early a defender recognizes and reacts to developing actions.', raw: ['anticipation', 'defensive_anticipation'], providerNative: true),\n"
          count = text.count(line)
          if count != 3:
              raise SystemExit(f'expected 3 anticipation definitions before repair; found {count}')
          text = text.replace(line * 3, line)
          path.write_text(text)
          keys = re.findall(r"_m\('([^']+)'", text)
          counts = Counter(keys)
          duplicates = {key: count for key, count in counts.items() if count > 1}
          print('definitions', len(keys))
          print('unique', len(counts))
          print('duplicates', duplicates)
          if duplicates:
              raise SystemExit('metric catalog still contains duplicate IDs')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "sports-terminal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lib/services/nba_stats_metric_catalog.dart
          git commit -m "Deduplicate stats metric catalog"
          git push origin HEAD:agent/stats-workstation-visual-and-metric-overhaul
