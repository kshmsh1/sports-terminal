name: Phase 3 one-time audited lockfile adoption
on:
  push:
    branches:
      - experiment/arcside-react-vite-phase3-2026-11
jobs:
  adopt-lockfile:
    if: ${{ github.repository == 'kshmsh1/sports-terminal' && github.ref == 'refs/heads/experiment/arcside-react-vite-phase3-2026-11' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch the lockfile produced by the passing audited Phase 3 CI run
        uses: actions/download-artifact@v4
        with:
          name: arcside-react-phase3-reviewed-package-lock
          run-id: 44449649882
          repository: kshmsh1/sports-terminal
          github-token: ${{ github.token }}
          path: experimental/arcside-react
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable lockfile install and advisory audit
        working-directory: experimental/arcside-react
        run: |
          npm install -g npm@11
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
      - name: Commit the vetted lockfile on the experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          git add experimental/arcside-react/package-lock.json
          if git diff --cached --quiet; then echo 'Lockfile already committed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock audited React dependencies for reproducible npm ci'
          git push origin HEAD:refs/heads/experiment/arcside-react-vite-phase3-2026-11
