name: Restore Role Shell Product Parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/role-shell-parity
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add missing product destinations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/widgets/role_terminal_shell.dart')
          text = path.read_text()
          import_anchor = "import '../screens/product_arena_home_screen.dart';\n"
          import_insert = """import '../screens/product_arena_home_screen.dart';
          import '../screens/product_backend_sync_screen.dart';
          """
          if text.count(import_anchor) != 1:
              raise SystemExit('Unexpected arena import anchor')
          text = text.replace(import_anchor, import_insert)
          content_anchor = "import '../screens/product_content_ops_screens.dart';\n"
          content_insert = """import '../screens/product_content_ops_screens.dart';
          import '../screens/product_fantasy_community_screens.dart';
          """
          if text.count(content_anchor) != 1:
              raise SystemExit('Unexpected content import anchor')
          text = text.replace(content_anchor, content_insert)
          role_anchor = "import '../screens/product_role_operations_screen.dart';\n"
          role_insert = """import '../screens/product_role_operations_screen.dart';
          import '../screens/product_strategy_map_screen.dart';
          import '../screens/product_team_blogs_screen.dart';
          """
          if text.count(role_anchor) != 1:
              raise SystemExit('Unexpected role import anchor')
          text = text.replace(role_anchor, role_insert)
          nav_anchor = """        const _Destination(
                    label: 'Articles',
                    group: 'Network',
                    icon: Icons.article_rounded,
                    screen: ProductArticlesArenaScreen(),
                  ),
          """
          nav_insert = """        const _Destination(
                    label: 'Strategy',
                    group: 'Product',
                    icon: Icons.radar_rounded,
                    screen: ProductStrategyMapScreen(),
                  ),
                  const _Destination(
                    label: 'Fantasy',
                    group: 'Product',
                    icon: Icons.bolt_rounded,
                    screen: ProductFantasyWarRoomScreen(),
                  ),
                  const _Destination(
                    label: 'Team Blogs',
                    group: 'Content',
                    icon: Icons.newspaper_rounded,
                    screen: ProductTeamBlogsScreen(),
                  ),
                  const _Destination(
                    label: 'Community',
                    group: 'Network',
                    icon: Icons.forum_rounded,
                    screen: ProductCommunityArenaScreen(),
                  ),
                  const _Destination(
                    label: 'Articles',
                    group: 'Network',
                    icon: Icons.article_rounded,
                    screen: ProductArticlesArenaScreen(),
                  ),
          """
          if text.count(nav_anchor) != 1:
              raise SystemExit('Unexpected article destination anchor')
          text = text.replace(nav_anchor, nav_insert)
          profile_anchor = """        _Destination(
                    label: 'Profile',
                    group: 'Account',
                    icon: Icons.person_rounded,
                    screen: ProductPersistedProfileScreen(session: widget.session),
                  ),
                ];
          """
          profile_insert = """        if (organizationMode)
                    _Destination(
                      label: 'Backend',
                      group: 'Organization',
                      icon: Icons.cloud_sync_rounded,
                      screen: ProductBackendSyncScreen(session: widget.session),
                    ),
                  if (organizationMode)
                    const _Destination(
                      label: 'Internal Lab',
                      group: 'Organization',
                      icon: Icons.science_rounded,
                      screen: ProductInternalLabScreen(),
                    ),
                  _Destination(
                    label: 'Profile',
                    group: 'Account',
                    icon: Icons.person_rounded,
                    screen: ProductPersistedProfileScreen(session: widget.session),
                  ),
                  const _Destination(
                    label: 'About Us',
                    group: 'Legal',
                    icon: Icons.info_outline_rounded,
                    screen: ProductLegalScreen(kind: 'about'),
                  ),
                  const _Destination(
                    label: 'Contact',
                    group: 'Legal',
                    icon: Icons.mail_outline_rounded,
                    screen: ProductLegalScreen(kind: 'contact'),
                  ),
                  const _Destination(
                    label: 'Privacy Policy',
                    group: 'Legal',
                    icon: Icons.privacy_tip_outlined,
                    screen: ProductLegalScreen(kind: 'privacy'),
                  ),
                  const _Destination(
                    label: 'Terms & Conditions',
                    group: 'Legal',
                    icon: Icons.description_outlined,
                    screen: ProductLegalScreen(kind: 'terms'),
                  ),
                ];
          """
          if text.count(profile_anchor) != 1:
              raise SystemExit('Unexpected profile destination anchor')
          path.write_text(text.replace(profile_anchor, profile_insert))
          PY
      - run: dart format lib/widgets/role_terminal_shell.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Commit parity restoration
        run: |
          rm .github/workflows/role_shell_parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore role shell product parity"
          git push origin HEAD:agent/role-shell-parity
