name: Arcside local companion quality
on:
  pull_request:
    paths:
      - 'python/arcside_companion/**'
      - 'web/labs/python/**'
      - '.github/workflows/labs_power_quality.yml'
  push:
    branches: [main]
    paths:
      - 'python/arcside_companion/**'
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development and integration dependencies
        run: python -m pip install -e 'python/arcside_companion[all]'
      - name: Static compile all companion modules
        run: python -m compileall -q python/arcside_companion/arcside_companion
      - name: Validate trusted local endpoints and protocols
        run: python -m pytest -q python/arcside_companion/tests

  browser-native:
    name: Browser-to-native IDE integration
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native runtime and browser harness
        run: |
          python -m pip install -e 'python/arcside_companion[all]'
          npm install --prefix web/labs --no-package-lock --ignore-scripts
          cd web/labs && npx playwright install --with-deps chromium
      - name: Start trusted test companion on loopback
        run: |
          mkdir -p /tmp/arcside-native-fixture
          python -c 'import uvicorn; from pathlib import Path; from arcside_companion.server import create_app; uvicorn.run(create_app(Path("/tmp/arcside-native-fixture"), ["http://127.0.0.1:8765"], token="arcside-e2e-secret-token-0123456789"),host="127.0.0.1",port=8766,access_log=False)' > /tmp/arcside-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/health
      - name: Exercise authenticated native Python in Chromium
        env:
          ARCSIDE_LOCAL_E2E_TOKEN: arcside-e2e-secret-token-0123456789
        run: cd web/labs && npx playwright test tests/local_runtime.browser.spec.mjs -c playwright.config.mjs --workers=1
      - name: Upload native-browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcside-native-ide-browser-failures
          path: |
            web/labs/test-results
            web/labs/playwright-report
          retention-days: 7
