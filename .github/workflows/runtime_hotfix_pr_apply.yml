name: Runtime Hotfix PR Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: agent/runtime-hardening-v1
          fetch-depth: 0

      - name: Apply transformer
        run: python tools/apply_runtime_hotfix.py

      - name: Commit transformed runtime
        shell: bash
        run: |
          git config user.name "sports-terminal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden audited async state callbacks"
          git push origin HEAD:agent/runtime-hardening-v1
