name: Front Office Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/front-office-ledger-sprint
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact interpolation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_front_office_scenario_screen.dart')
          text = path.read_text()
          old = "${owner}_${original}_${year}_R$draftRound_${DateTime.now().microsecondsSinceEpoch}"
          new = "${owner}_${original}_${year}_R${draftRound}_${DateTime.now().microsecondsSinceEpoch}"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one interpolation target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: flutter pub get
      - run: dart format lib/screens/product_front_office_scenario_screen.dart
      - name: Capture analyzer transcript
        shell: bash
        run: |
          set +e
          flutter analyze > analyzer.log 2>&1
          status=$?
          cat analyzer.log
          echo "$status" > analyzer.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: front-office-analyzer-v2
          path: |
            analyzer.log
            analyzer.status
          retention-days: 3
      - name: Fail when analysis fails
        run: test "$(cat analyzer.status)" = "0"
