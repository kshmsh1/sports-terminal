name: Front Office Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/front-office-ledger-sprint
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact analyzer repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_front_office_scenario_screen.dart')
          text = path.read_text()
          old = "${owner}_${original}_${year}_R$draftRound_${DateTime.now().microsecondsSinceEpoch}"
          new = "${owner}_${original}_${year}_R${draftRound}_${DateTime.now().microsecondsSinceEpoch}"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one interpolation target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format repaired file
        run: dart format lib/screens/product_front_office_scenario_screen.dart
      - name: Analyze project
        run: flutter analyze
      - name: Run complete test suite
        run: flutter test
      - name: Build release web application
        run: flutter build web --release
      - name: Commit validated repair
        shell: bash
        run: |
          rm .github/workflows/front_office_diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/product_front_office_scenario_screen.dart .github/workflows/front_office_diagnostics.yml
          git commit -m "Repair and validate front office ledger"
          git push origin HEAD:agent/front-office-ledger-sprint
