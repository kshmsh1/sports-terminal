name: Front Office Final Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/front-office-ledger-sprint
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact syntax repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_front_office_scenario_screen.dart')
          text = path.read_text()
          old = "${owner}_${original}_${year}_R$draftRound_${DateTime.now().microsecondsSinceEpoch}"
          new = "${owner}_${original}_${year}_R${draftRound}_${DateTime.now().microsecondsSinceEpoch}"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one interpolation target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: flutter pub get
      - run: dart format lib/screens/product_front_office_scenario_screen.dart
      - name: Apply exact brace repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/product_front_office_scenario_screen.dart')
          text = path.read_text()
          replacements = [
              (
                  """    if (!loaded)
      return const _Surface(
        child: Text(
          'Loading front-office ledger...',
          style: TextStyle(color: _muted),
        ),
      );""",
                  """    if (!loaded) {
      return const _Surface(
        child: Text(
          'Loading front-office ledger...',
          style: TextStyle(color: _muted),
        ),
      );
    }""",
              ),
              (
                  """        if (!snapshot.hasData)
          return const _Surface(
            child: Text(
              'Loading official cap environments...',
              style: TextStyle(color: _muted),
            ),
          );""",
                  """        if (!snapshot.hasData) {
          return const _Surface(
            child: Text(
              'Loading official cap environments...',
              style: TextStyle(color: _muted),
            ),
          );
        }""",
              ),
              (
                  """    if (findings.isEmpty)
      return const _Notice(
        text: 'No structural ledger findings.',
        danger: false,
      );""",
                  """    if (findings.isEmpty) {
      return const _Notice(
        text: 'No structural ledger findings.',
        danger: false,
      );
    }""",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one brace target, found {text.count(old)} for:\n{old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: dart format lib/screens/product_front_office_scenario_screen.dart
      - name: Analyze project
        run: flutter analyze
      - name: Run complete test suite
        run: flutter test
      - name: Build release web application
        run: flutter build web --release
      - name: Commit validated sprint
        shell: bash
        run: |
          rm .github/workflows/front_office_diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/product_front_office_scenario_screen.dart .github/workflows/front_office_diagnostics.yml
          git commit -m "Repair and validate front office ledger"
          git push origin HEAD:agent/front-office-ledger-sprint
