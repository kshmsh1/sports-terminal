name: Terminal Palette Migration

on:
  push:
    branches: [agent/stats-workstation-visual-and-metric-overhaul]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stats-workstation-visual-and-metric-overhaul
      - name: Apply graphite terminal palette
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_nba_terminal_screen.dart')
          text = path.read_text()
          replacements = {
            "const _tBg = Color(0xFF06101B);": "const _tBg = Color(0xFF090D12);",
            "const _tPanel = Color(0xFF0D1A28);": "const _tPanel = Color(0xFF0F151C);",
            "const _tPanel2 = Color(0xFF142437);": "const _tPanel2 = Color(0xFF141C25);",
            "const _tLine = Color(0xFF2A4057);": "const _tLine = Color(0xFF263342);",
            "const _tText = Color(0xFFF3F7FB);": "const _tText = Color(0xFFE8EDF3);",
            "const _tMuted = Color(0xFF9FB0C2);": "const _tMuted = Color(0xFF8895A5);",
            "const _tGold = Color(0xFFFFCB45);": "const _tGold = Color(0xFF63A9FF);",
            "const _tBlue = Color(0xFF6CB8FF);": "const _tBlue = Color(0xFF8BC1FF);",
            "const _tGreen = Color(0xFF65E3A5);": "const _tGreen = Color(0xFF69C99A);",
            "const _tOrange = Color(0xFFFF9A5A);": "const _tOrange = Color(0xFFE2B866);",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one palette token: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "sports-terminal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/product_nba_terminal_screen.dart
          git commit -m "Align NBA Terminal shell with visual system v2"
          git push origin HEAD:agent/stats-workstation-visual-and-metric-overhaul
