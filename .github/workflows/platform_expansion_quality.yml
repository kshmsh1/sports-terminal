name: Platform Expansion Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/full-platform-product-expansion]

permissions:
  contents: read

concurrency:
  group: platform-expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate platform expansion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend and tools
        run: python -m compileall -q backend/app backend/scripts tools

      - name: Test platform expansion backend contract
        run: python backend/scripts/platform_expansion_contract_test.py

      - name: Test launch authentication and persistence contract
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/launch_contract_test.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze product
        run: flutter analyze

      - name: Test expansion source contracts
        run: flutter test test/platform_expansion_contract_test.dart

      - name: Test Trade Machine v2 engine
        run: flutter test test/trade_machine_v2_engine_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release
