name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build product
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply Trade Machine restore precedence fix
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/platform-pages-routing-trade-legal-notebook'
        shell: bash
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_trade_machine_v2_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "final restoredTeams = saved['teams'] ?? ''\n        .split('|')"
          new = "final restoredTeams = (saved['teams'] ?? '')\n        .split('|')"
          if old not in text:
              raise SystemExit('restore precedence anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "sports-terminal-ci"
          git config user.email "sports-terminal-ci@users.noreply.github.com"
          git add lib/screens/product_trade_machine_v2_screen.dart
          git commit -m "Fix Trade Machine restored-team parsing"
          git push origin HEAD:"$GITHUB_HEAD_REF"
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile launch backend
        run: python -m compileall -q backend/app tools

      - name: Test NBA API metric coverage audit contract
        run: python backend/scripts/nba_api_metric_coverage_contract_test.py

      - name: Install pinned NBA API schema package
        run: python -m pip install nba_api==1.11.4

      - name: Audit declared NBA API metric coverage
        run: python tools/audit_nba_api_metric_coverage.py --check

      - name: Retain NBA API coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nba-api-metric-coverage
          path: |
            artifacts/nba_api_metric_coverage.json
            artifacts/nba_api_metric_coverage.md
          retention-days: 14

      - name: Test historical NBA import contract
        run: python backend/scripts/historical_import_contract_test.py

      - name: Test historical NBA canonical platform
        run: python backend/scripts/historical_canonical_contract_test.py

      - name: Test historical traded-player leaderboard semantics
        run: python backend/scripts/historical_leaderboard_contract_test.py

      - name: Test historical seed compatibility projection
        run: python backend/scripts/historical_seed_compat_contract_test.py

      - name: Test deep historical NBA research contract
        run: python backend/scripts/historical_research_launch_contract_test.py

      - name: Test historical NBA entity intelligence contract
        run: python backend/scripts/historical_entity_intelligence_contract_test.py

      - name: Test canonical NBA awards and voting contract
        run: python backend/scripts/nba_awards_contract_test.py

      - name: Test expanded community network contract
        run: python backend/scripts/community_network_contract_test.py

      - name: Test durable Sports Terminal profile contract
        run: python backend/scripts/profile_contract_test.py

      - name: Test mandatory legal consent contract
        run: python backend/scripts/legal_consent_contract_test.py

      - name: Test unified NBA terminal contract
        run: python backend/scripts/nba_terminal_contract_test.py

      - name: Audit page scroll ownership
        run: python tools/audit_page_scroll_ownership.py --check

      - name: Audit canonical NBA entity links
        run: python tools/audit_nba_entity_links.py --check

      - name: Test launch backend contracts
        id: backend_contract
        working-directory: backend
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/launch_contract_test.py > backend_contract.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=. python scripts/run_platform_completion_contract_test.py >> backend_contract.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=. python scripts/workspace_completion_contract_test.py >> backend_contract.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=. python scripts/customer_operations_contract_test.py >> backend_contract.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=. python scripts/automation_governance_contract_test.py >> backend_contract.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=. python scripts/http_contract_test.py >> backend_contract.log 2>&1
            status=$?
          fi
          cat backend_contract.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain backend contract diagnostics
        if: steps.backend_contract.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-diagnostics
          path: backend/backend_contract.log
          retention-days: 7

      - name: Stop on backend contract failure
        if: steps.backend_contract.outputs.status != '0'
        run: exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze project
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyzer.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain analyzer diagnostics
        if: steps.analyze.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer-diagnostics
          path: analyzer.log
          retention-days: 7

      - name: Stop on analyzer failure
        if: steps.analyze.outputs.status != '0'
        run: exit 1

      - name: Run test suite
        id: flutter_tests
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee flutter_test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain Flutter test diagnostics
        if: steps.flutter_tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: flutter_test.log
          retention-days: 7

      - name: Stop on Flutter test failure
        if: steps.flutter_tests.outputs.status != '0'
        run: exit 1

      - name: Build web application
        run: flutter build web --release
