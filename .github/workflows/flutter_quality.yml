name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build product
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile launch backend
        run: python -m compileall -q backend/app tools

      - name: Test launch backend contracts
        id: backend_contract
        working-directory: backend
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/launch_contract_test.py > backend_contract.log 2>&1
          status=$?
          cat backend_contract.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain backend contract diagnostics
        if: steps.backend_contract.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-diagnostics
          path: backend/backend_contract.log
          retention-days: 7

      - name: Stop on backend contract failure
        if: steps.backend_contract.outputs.status != '0'
        run: exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze project
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyzer.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain analyzer diagnostics
        if: steps.analyze.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer-diagnostics
          path: analyzer.log
          retention-days: 7

      - name: Stop on analyzer failure
        if: steps.analyze.outputs.status != '0'
        run: exit 1

      - name: Run test suite
        run: flutter test

      - name: Build web application
        run: flutter build web --release
