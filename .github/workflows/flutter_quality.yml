name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run test suite and capture transcript
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-transcript
          path: flutter-test.log
          if-no-files-found: error

      - name: Fail when tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Build web application
        run: flutter build web
