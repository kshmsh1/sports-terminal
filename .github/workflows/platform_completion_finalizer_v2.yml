name: Platform Completion Finalizer V2

on:
  push:
    branches:
      - agent/contracts-moderation-workspace-runtime
      - main

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: platform-completion-finalizer-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-committed-tree-and-merge:
    if: github.ref == 'refs/heads/agent/contracts-moderation-workspace-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic final cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authorization = Path('backend/app/authorization_guard.py')
          text = authorization.read_text(encoding='utf-8')
          if '_PUBLIC_PREFIXES' not in text:
              text = text.replace(
                  '_ADMIN_PREFIXES = (\n',
                  '_PUBLIC_PREFIXES = (\n'
                  '    "/v2/auth/",\n'
                  '    "/v2/launch/readiness",\n'
                  ')\n'
                  '_ADMIN_PREFIXES = (\n',
              )
          text = text.replace(
              '    "user_id",\n    "recipient_user_id",\n}\n_SELF_BODY_KEYS = {\n'
              '    "actor_user_id",\n    "viewer_user_id",\n    "user_id",\n'
              '    "recipient_user_id",\n    "created_by_user_id",\n}',
              '    "user_id",\n    "recipient_user_id",\n    "owner_user_id",\n}\n'
              '_SELF_BODY_KEYS = {\n    "actor_user_id",\n    "viewer_user_id",\n'
              '    "created_by_user_id",\n    "owner_user_id",\n}',
          )
          if 'request.url.path.startswith(prefix) for prefix in _PUBLIC_PREFIXES' not in text:
              text = text.replace(
                  '    if not _enabled() or not request.url.path.startswith("/v2/"):\n'
                  '        return await call_next(request)\n\n'
                  '    identity = _session_identity(_token(request))',
                  '    if not _enabled() or not request.url.path.startswith("/v2/"):\n'
                  '        return await call_next(request)\n'
                  '    if any(request.url.path.startswith(prefix) for prefix in _PUBLIC_PREFIXES):\n'
                  '        return await call_next(request)\n\n'
                  '    identity = _session_identity(_token(request))',
              )
          text = text.replace(
              '    mismatch = _claim_mismatch(query, _SELF_QUERY_KEYS, user_id)\n',
              '    mismatch = "" if _platform(role) else _claim_mismatch(\n'
              '        query, _SELF_QUERY_KEYS, user_id\n'
              '    )\n',
          )
          text = text.replace(
              '                mismatch = _claim_mismatch(decoded, _SELF_BODY_KEYS, user_id)\n',
              '                mismatch = "" if _platform(role) else _claim_mismatch(\n'
              '                    decoded, _SELF_BODY_KEYS, user_id\n'
              '                )\n',
          )
          authorization.write_text(text, encoding='utf-8')

          launch = Path('backend/app/main_launch.py')
          text = launch.read_text(encoding='utf-8')
          if 'from .authorization_guard import enforce_launch_authorization' not in text:
              text = text.replace(
                  'from .auth_guard import enforce_launch_auth\n',
                  'from .auth_guard import enforce_launch_auth\n'
                  'from .authorization_guard import enforce_launch_authorization\n',
              )
          if 'front_office_hardened_router' not in text:
              text = text.replace(
                  'from .front_office_api import router as front_office_router\n',
                  'from .front_office_api import router as front_office_router\n'
                  'from .front_office_hardened_routes import router as front_office_hardened_router\n',
              )
          if 'app.middleware("http")(enforce_launch_authorization)' not in text:
              text = text.replace(
                  'app.middleware("http")(launch_operations_middleware)\n',
                  'app.middleware("http")(launch_operations_middleware)\n'
                  'app.middleware("http")(enforce_launch_authorization)\n',
              )
          if 'app.include_router(front_office_hardened_router)' not in text:
              text = text.replace(
                  'app.include_router(front_office_router)\n',
                  'app.include_router(front_office_hardened_router)\n'
                  'app.include_router(front_office_router)\n',
              )
          launch.write_text(text, encoding='utf-8')

          overnight = Path('scripts/overnight_platform_completion.sh')
          text = overnight.read_text(encoding='utf-8').replace(
              'command -v docker compose >/dev/null 2>&1',
              'docker compose version >/dev/null 2>&1',
          )
          overnight.write_text(text, encoding='utf-8')
          Path('backend/app/workspace_hardening.py').unlink(missing_ok=True)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart source
        run: dart format lib test

      - name: Commit exact tree under validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sports-terminal-ci'
          git config user.email 'sports-terminal-ci@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize authorization wiring and format completion products'
            git push origin HEAD:agent/contracts-moderation-workspace-runtime
          fi
          echo "VALIDATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert final launch wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enforce_launch_authorization' backend/app/main_launch.py
          grep -q 'front_office_hardened_router' backend/app/main_launch.py
          grep -q 'app.include_router(front_office_hardened_router)' backend/app/main_launch.py
          grep -q 'docker compose version' scripts/overnight_platform_completion.sh
          test ! -f backend/app/workspace_hardening.py
          bash -n scripts/overnight_platform_completion.sh
          git diff --exit-code

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend scripts and tools
        run: python -m compileall -q backend/app backend/scripts tools

      - name: Run launch backend contract
        run: PYTHONPATH=backend python backend/scripts/launch_contract_test.py

      - name: Run platform completion contract
        run: PYTHONPATH=backend python backend/scripts/run_platform_completion_contract_test.py

      - name: Run Workspace completion contract
        run: PYTHONPATH=backend python backend/scripts/workspace_completion_contract_test.py

      - name: Run real HTTP contract
        run: PYTHONPATH=backend python backend/scripts/http_contract_test.py

      - name: Validate catalog CLI example
        run: |
          PYTHONPATH=backend python tools/front_office_catalog.py validate \
            docs/examples/front_office_catalog.example.json \
            --report /tmp/front_office_catalog_example_report.json

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Pre-Data Gate
        run: bash tools/check_pre_import_state.sh

      - name: Run strict Flutter analysis
        run: flutter analyze

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release

      - name: Mark ready and merge the validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh pr view 12 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$CURRENT_SHA" = "$VALIDATED_SHA"
          gh pr ready 12 --repo "$GITHUB_REPOSITORY" || true
          if ! gh pr merge 12 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$VALIDATED_SHA" \
            --subject 'Complete contracts, trust safety, Workspace and Python runtime' \
            --body 'Validated exact tree: backend contracts, real HTTP authorization contract, catalog validation, Pre-Data Gate, strict Flutter analysis, complete Flutter tests and release web build.'; then
            gh pr merge 12 \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --auto \
              --delete-branch \
              --match-head-commit "$VALIDATED_SHA" \
              --subject 'Complete contracts, trust safety, Workspace and Python runtime' \
              --body 'Validated exact tree: backend contracts, real HTTP authorization contract, catalog validation, Pre-Data Gate, strict Flutter analysis, complete Flutter tests and release web build.'
          fi

  remove-temporary-finalizers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Remove temporary finalizer workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sports-terminal-ci'
          git config user.email 'sports-terminal-ci@users.noreply.github.com'
          rm -f .github/workflows/platform_completion_finalizer.yml
          rm -f .github/workflows/platform_completion_finalizer_v2.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary platform completion finalizers'
            git push origin main
          fi
