name: NBA.com Historical Capture

on:
  workflow_dispatch:
  push:
    branches: [nba-com-historical-capture-part-1]
    paths:
      - .github/workflows/nba_com_historical_capture.yml
      - assets/data/nba/metadata/nba_com_capture_plan_part1.json
      - tools/fetch_nba_com_historical_stats.py
      - tools/audit_nba_com_historical_capture.py
      - tools/materialize_nba_com_static_data.py

permissions:
  contents: read

concurrency:
  group: nba-com-historical-capture-part1
  cancel-in-progress: true

jobs:
  plan:
    name: Build 80-season capture matrix
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture]')
    runs-on: ubuntu-latest
    outputs:
      seasons: ${{ steps.matrix.outputs.seasons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build season matrix
        id: matrix
        shell: bash
        run: |
          seasons="$(python - <<'PY'
          import json
          print(json.dumps([f"{year}-{(year + 1) % 100:02d}" for year in range(2025, 1945, -1)], separators=(",", ":")))
          PY
          )"
          echo "seasons=$seasons" >> "$GITHUB_OUTPUT"
          python tools/fetch_nba_com_historical_stats.py --plan-summary

  capture:
    name: Capture ${{ matrix.season }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: ${{ fromJSON(needs.plan.outputs.seasons) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Chrome-like NBA.com transport
        run: python -m pip install --disable-pip-version-check 'curl-cffi>=0.7,<1.0'

      - name: Capture every Part 1 surface for season
        id: scrape
        shell: bash
        run: |
          set +e
          python tools/fetch_nba_com_historical_stats.py             --season "${{ matrix.season }}"             --transport chrome             --delay 2.0             --timeout 30             --retries 2             --abort-after 20             --output raw/nba_com_stats             2>&1 | tee "capture-${{ matrix.season }}.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit season capture
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          season = "${{ matrix.season }}"
          root = Path("raw/nba_com_stats")
          rows = []
          counts = {}
          for path in root.glob(f"*/*/{season}/*/metadata.json"):
              data = json.loads(path.read_text())
              status = str(data.get("validation_status") or "unknown")
              counts[status] = counts.get(status, 0) + 1
              rows.append(data)
          print(json.dumps({"season": season, "scope_count": len(rows), "status_counts": counts}, indent=2))
          if len(rows) != 168:
              raise SystemExit(f"Expected 168 scopes for {season}, recorded {len(rows)}")
          bad = [row for row in rows if row.get("validation_status") not in {"success", "empty", "unavailable"}]
          if bad:
              raise SystemExit(f"{len(bad)} scopes failed or were invalid")
          PY

      - name: Remove duplicate wire-format responses from CI artifact
        if: always()
        run: find raw/nba_com_stats -name source.json -type f -delete || true

      - name: Pack normalized season capture
        if: always()
        run: |
          tar --zstd -cf "nba-com-${{ matrix.season }}.tar.zst" raw/nba_com_stats "capture-${{ matrix.season }}.log"

      - name: Upload normalized season capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-com-${{ matrix.season }}
          path: nba-com-${{ matrix.season }}.tar.zst
          retention-days: 30
          compression-level: 0

      - name: Stop on scrape failure
        if: steps.scrape.outputs.status != '0'
        run: exit 1

  assemble:
    name: Assemble Sports Terminal NBA.com corpus
    needs: [plan, capture]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all season captures
        uses: actions/download-artifact@v5
        with:
          pattern: nba-com-*
          path: downloads

      - name: Merge season archives
        shell: bash
        run: |
          mkdir -p merged
          shopt -s nullglob
          archives=(downloads/*/*.tar.zst)
          if [ "${#archives[@]}" -ne 80 ]; then
            echo "Expected 80 season artifacts, found ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            tar --zstd -xf "$archive" -C merged
          done

      - name: Audit complete 1946-47 through 2025-26 capture
        run: |
          python tools/audit_nba_com_historical_capture.py             --root merged/raw/nba_com_stats             --require-complete             --output merged/nba_com_capture_audit.json

      - name: Materialize same-origin Sports Terminal corpus
        run: |
          python tools/materialize_nba_com_static_data.py             --raw-root merged/raw/nba_com_stats             --output merged/sports_terminal_static

      - name: Pack Sports Terminal static corpus
        run: |
          tar --zstd -cf sports-terminal-nba-com-part1.tar.zst             -C merged/sports_terminal_static nba_com             -C .. nba_com_capture_audit.json

      - name: Upload Sports Terminal static corpus
        uses: actions/upload-artifact@v4
        with:
          name: sports-terminal-nba-com-part1
          path: sports-terminal-nba-com-part1.tar.zst
          retention-days: 30
          compression-level: 0
