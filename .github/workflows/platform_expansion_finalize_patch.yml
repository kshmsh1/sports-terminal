name: Finalize Platform Expansion Integration Patch

on:
  push:
    branches: [agent/full-platform-product-expansion]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-platform-product-expansion
          fetch-depth: 0
      - name: Apply deterministic integration fixes one final time
        run: python tools/apply_platform_expansion_integration_fixes.py
      - name: Remove temporary patch machinery
        shell: bash
        run: |
          git rm -f .github/workflows/platform_expansion_integration_patch.yml || true
          git rm -f tools/apply_platform_expansion_integration_fixes.py || true
          git rm -f .github/workflows/platform_expansion_finalize_patch.yml || true
      - name: Commit clean integrated source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to finalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize platform expansion integration"
          git push origin HEAD:agent/full-platform-product-expansion
