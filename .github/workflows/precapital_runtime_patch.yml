name: Precapital Runtime Patch

on:
  push:
    branches: [agent/pre-capital-data-completion]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pre-capital-data-completion
      - name: Harden Advanced Stats refresh state mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_nba_advanced_stats_page_screen.dart')
          text = path.read_text()
          old = """  void _refreshSources() {\n    setState(() => _source = _loadSource());\n  }\n"""
          new = """  void _refreshSources() {\n    setState(() {\n      _source = _loadSource();\n    });\n  }\n"""
          if old not in text:
              raise SystemExit('expected Advanced Stats refresh callback not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/precapital_runtime_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/product_nba_advanced_stats_page_screen.dart .github/workflows/precapital_runtime_patch.yml
          git commit -m "Harden Advanced Stats refresh runtime state"
          git push origin HEAD:agent/pre-capital-data-completion
