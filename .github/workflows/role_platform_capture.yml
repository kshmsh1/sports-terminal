name: Capture Role Platform Findings

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/role-platform-transaction-workflows
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get >/dev/null
      - name: Capture findings
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          tail -n 120 /tmp/analyze.log > docs/temp_role_platform_analyzer.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/temp_role_platform_analyzer.txt
          git commit -m "Capture full role platform analyzer finding"
          git push origin HEAD:agent/role-platform-transaction-workflows
