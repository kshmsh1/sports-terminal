name: Arcside local Python companion

on:
  pull_request:
    paths:
      - 'tools/arcside_companion/**'
      - '.github/workflows/arcside_companion.yml'
  push:
    branches: [main]
    paths:
      - 'tools/arcside_companion/**'
      - '.github/workflows/arcside_companion.yml'

jobs:
  local-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local companion and tests
        run: python -m pip install -e "./tools/arcside_companion[test]"
      - name: Compile Python modules
        run: python -m compileall -q tools/arcside_companion
      - name: Exercise authenticated local API
        run: python -m pytest -q tools/arcside_companion/tests
