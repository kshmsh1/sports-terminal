name: Historical Research Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/nba-game-command-center

permissions:
  contents: read

concurrency:
  group: historical-research-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-contract:
    name: Validate historical research contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile historical backend
        run: python -m compileall -q backend/app tools
      - name: Raw historical import contract
        run: python backend/scripts/historical_import_contract_test.py
      - name: Canonical historical platform contract
        run: python backend/scripts/historical_canonical_contract_test.py
      - name: Traded-player leaderboard contract
        run: python backend/scripts/historical_leaderboard_contract_test.py
      - name: Historical seed compatibility contract
        run: python backend/scripts/historical_seed_compat_contract_test.py
      - name: Deep historical research contract
        run: python backend/scripts/historical_research_launch_contract_test.py
      - name: Entity and season intelligence contract
        run: python backend/scripts/historical_entity_intelligence_contract_test.py
      - name: Unified NBA terminal contract
        run: python backend/scripts/nba_terminal_contract_test.py
