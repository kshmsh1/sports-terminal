name: Platform Completion Finalizer

on:
  push:
    branches:
      - agent/contracts-moderation-workspace-runtime
      - main

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: platform-completion-finalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-queue-merge:
    if: github.ref == 'refs/heads/agent/contracts-moderation-workspace-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert final launch wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enforce_launch_authorization' backend/app/main_launch.py
          grep -q 'front_office_hardened_router' backend/app/main_launch.py
          grep -q 'app.include_router(front_office_hardened_router)' backend/app/main_launch.py
          grep -q 'docker compose version' scripts/overnight_platform_completion.sh
          test ! -f backend/app/workspace_hardening.py
          bash -n scripts/overnight_platform_completion.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend scripts and tools
        run: python -m compileall -q backend/app backend/scripts tools

      - name: Run launch backend contract
        run: PYTHONPATH=backend python backend/scripts/launch_contract_test.py

      - name: Run platform completion contract
        run: PYTHONPATH=backend python backend/scripts/run_platform_completion_contract_test.py

      - name: Run Workspace completion contract
        run: PYTHONPATH=backend python backend/scripts/workspace_completion_contract_test.py

      - name: Run real HTTP contract
        run: PYTHONPATH=backend python backend/scripts/http_contract_test.py

      - name: Validate catalog CLI example
        run: |
          PYTHONPATH=backend python tools/front_office_catalog.py validate \
            docs/examples/front_office_catalog.example.json \
            --report /tmp/front_office_catalog_example_report.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Pre-Data Gate
        run: bash tools/check_pre_import_state.sh

      - name: Run strict Flutter analysis
        run: flutter analyze

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release

      - name: Mark PR ready and queue squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 12 --repo "$GITHUB_REPOSITORY" || true
          gh pr merge 12 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch \
            --subject 'Complete contracts, trust safety, Workspace and Python runtime' \
            --body 'Validated by the Platform Completion Finalizer: backend contracts, real HTTP contract, catalog validation, Pre-Data Gate, strict Flutter analysis, complete Flutter tests and release web build.'

  remove-finalizer-from-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Remove temporary finalizer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sports-terminal-ci'
          git config user.email 'sports-terminal-ci@users.noreply.github.com'
          git rm .github/workflows/platform_completion_finalizer.yml
          git commit -m 'Remove temporary platform completion finalizer'
          git push origin main
