name: Finalize Trade Rule Conservatism

on:
  push:
    branches: [agent/full-platform-product-expansion]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-platform-product-expansion
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply rule correction
        run: python tools/finalize_trade_rule_conservatism.py
      - name: Format rule engine
        run: dart format lib/services/trade_machine_engine.dart
      - name: Remove temporary rule fixer and commit
        shell: bash
        run: |
          git rm -f tools/finalize_trade_rule_conservatism.py
          git rm -f .github/workflows/finalize_trade_rule_conservatism.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use conservative first-apron salary matching"
          git push origin HEAD:agent/full-platform-product-expansion
