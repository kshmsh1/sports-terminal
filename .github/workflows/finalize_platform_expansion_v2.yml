name: Finalize Platform Expansion V2

on:
  push:
    branches: [agent/platform-pages-routing-trade-legal-notebook]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run one-shot profile and community composition patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/platform-pages-routing-trade-legal-notebook
          fetch-depth: 0
      - name: Apply durable composition fixes and self-clean
        run: python tools/finalize_platform_expansion_v2.py
      - name: Commit durable fixes
        run: |
          git config user.name "sports-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mount durable profile API and fix Community composer" || exit 0
          git push origin HEAD:agent/platform-pages-routing-trade-legal-notebook
