name: Role Platform Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/role-platform-transaction-workflows
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and apply safe Dart fixes
        run: |
          dart format \
            lib/models/app_session.dart \
            lib/models/transaction_case.dart \
            lib/services/cba_transaction_rules_engine.dart \
            lib/services/transaction_case_repository.dart \
            lib/screens/product_role_operations_screen.dart \
            lib/widgets/app_entry_gate.dart \
            lib/widgets/role_terminal_shell.dart \
            test/transaction_case_workflow_test.dart
          dart fix --apply
          dart format lib test
      - name: Analyze concise
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          status=$?
          tail -n 120 /tmp/analyze.log
          exit $status
      - run: flutter test
      - run: flutter build web --release
      - name: Commit validated product phase
        run: |
          rm .github/workflows/role_platform_repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and validate role platforms"
          git push origin HEAD:agent/role-platform-transaction-workflows
