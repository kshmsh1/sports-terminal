name: Pre-Data Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-data-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run pre-data gate
        run: bash tools/run_pre_data_gate.sh
