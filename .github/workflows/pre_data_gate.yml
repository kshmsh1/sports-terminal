name: Pre-Data Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-data-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run pre import check
        run: bash tools/check_pre_import_state.sh
