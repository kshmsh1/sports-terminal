name: Fix Platform Expansion Tests

on:
  push:
    branches: [agent/full-platform-product-expansion]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-platform-product-expansion
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply test fixes
        run: python tools/fix_platform_expansion_tests.py
      - name: Format tests
        run: dart format test/platform_expansion_contract_test.dart test/trade_machine_v2_engine_test.dart
      - name: Remove temporary fixer and commit
        shell: bash
        run: |
          git rm -f tools/fix_platform_expansion_tests.py
          git rm -f .github/workflows/fix_platform_expansion_tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden platform expansion regression tests"
          git push origin HEAD:agent/full-platform-product-expansion
