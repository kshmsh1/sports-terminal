name: NBA.com Transport Probe

on:
  push:
    branches: [nba-com-historical-capture-part-1]
    paths:
      - .github/workflows/nba_com_transport_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Chrome-like transport
        run: python -m pip install --disable-pip-version-check 'curl-cffi>=0.7,<1.0'
      - name: Probe NBA.com Stats
        run: |
          python tools/fetch_nba_com_historical_stats.py \
            --season 2025-26 \
            --surface players_hustle \
            --season-type regular \
            --transport chrome \
            --timeout 10 \
            --retries 0 \
            --delay 0 \
            --probe-only \
            --output /tmp/nba_com_probe
