name: Platform Expansion Integration Patch

on:
  push:
    branches: [agent/full-platform-product-expansion]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-platform-product-expansion
      - name: Apply integration fixes
        run: python tools/apply_platform_expansion_integration_fixes.py
      - name: Commit integration fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "Apply platform expansion integration fixes"
          git push origin HEAD:agent/full-platform-product-expansion
