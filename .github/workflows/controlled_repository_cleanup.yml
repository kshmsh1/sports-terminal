name: Controlled Repository Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Apply, validate, and commit audited cleanup
    if: github.head_ref == 'agent/controlled-repository-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/controlled-repository-cleanup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audited cleanup
        run: python3 tool/controlled_repository_cleanup.py

      - name: Refresh dependency lockfile
        run: flutter pub get

      - name: Format modified Dart sources
        run: |
          dart format \
            lib/screens/compare_screen.dart \
            lib/screens/product_advanced_nba_tools_screen.dart \
            lib/screens/product_content_ops_screens.dart \
            lib/screens/product_python_dev_lab_screen.dart \
            lib/screens/product_shell_screens.dart

      - name: Capture machine-readable analyzer findings
        shell: bash
        run: |
          set +e
          dart analyze --format machine > initial_analyzer_machine.txt 2>&1
          exit 0

      - name: Upload machine analyzer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: machine-analyzer-diagnostics
          path: initial_analyzer_machine.txt
          if-no-files-found: error
          retention-days: 7

      - name: Patch only analyzer-reported flow controls
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          machine = Path('initial_analyzer_machine.txt').read_text(encoding='utf-8')
          findings: dict[Path, list[int]] = defaultdict(list)
          other_findings: list[str] = []

          for raw_line in machine.splitlines():
              parts = raw_line.split('|', 7)
              if len(parts) != 8:
                  continue
              severity, issue_type, code, file_name, line, column, length, message = parts
              if code == 'curly_braces_in_flow_control_structures':
                  findings[Path(file_name).resolve()].append(int(line))
              else:
                  other_findings.append(raw_line)

          total = sum(len(lines) for lines in findings.values())
          if total != 8:
              raise SystemExit(
                  f'Expected exactly 8 flow-control findings; found {total}.\n'
                  + machine
              )
          if other_findings:
              raise SystemExit(
                  'Unexpected analyzer findings before targeted repair:\n'
                  + '\n'.join(other_findings)
              )

          same_line = re.compile(r'^(\s*)if \((.+)\) (.+;)\s*$')
          patched = 0

          for path, issue_lines in findings.items():
              lines = path.read_text(encoding='utf-8').splitlines()
              for line_number in sorted(issue_lines, reverse=True):
                  index = line_number - 1
                  current = lines[index]
                  match = same_line.match(current)
                  if match:
                      indent, condition, statement = match.groups()
                      lines[index:index + 1] = [
                          f'{indent}if ({condition}) {{',
                          f'{indent}  {statement}',
                          f'{indent}}}',
                      ]
                      patched += 1
                      continue

                  if index > 0 and lines[index - 1].lstrip().startswith('if ('):
                      if_line = lines[index - 1]
                      statement = current.strip()
                      indent = if_line[: len(if_line) - len(if_line.lstrip())]
                      if not statement.endswith(';'):
                          raise SystemExit(
                              f'Unsupported flow-control statement at {path}:{line_number}'
                          )
                      lines[index - 1:index + 1] = [
                          f'{if_line} {{',
                          f'{indent}  {statement}',
                          f'{indent}}}',
                      ]
                      patched += 1
                      continue

                  raise SystemExit(
                      f'Could not patch analyzer finding at {path}:{line_number}: {current}'
                  )

              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if patched != 8:
              raise SystemExit(f'Expected to patch 8 findings; patched {patched}')
          print('Patched exactly 8 analyzer-reported flow-control findings.')
          PY
          dart format \
            lib/screens/compare_screen.dart \
            lib/screens/product_advanced_nba_tools_screen.dart \
            lib/screens/product_content_ops_screens.dart \
            lib/screens/product_python_dev_lab_screen.dart \
            lib/screens/product_shell_screens.dart

      - name: Capture strict analyzer output
        id: analyzer
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee strict_analyzer.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload strict analyzer transcript
        uses: actions/upload-artifact@v4
        with:
          name: strict-analyzer-transcript
          path: strict_analyzer.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when strict analysis fails
        if: steps.analyzer.outputs.status != '0'
        run: exit 1

      - name: Run complete test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release

      - name: Commit validated cleanup
        shell: bash
        run: |
          rm .github/workflows/controlled_repository_cleanup.yml
          rm tool/controlled_repository_cleanup.py
          rm strict_analyzer.txt
          rm initial_analyzer_machine.txt
          git config user.name "Sports Terminal Cleanup Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove unreachable code and normalize repository"
          git push origin HEAD:agent/controlled-repository-cleanup

      - name: Remove closed audit branches
        continue-on-error: true
        run: |
          git push origin --delete agent/validate-compile-repair || true
          git push origin --delete agent/repository-efficiency-audit || true
