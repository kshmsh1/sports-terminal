name: Controlled Repository Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Apply, validate, and commit audited cleanup
    if: github.head_ref == 'agent/controlled-repository-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/controlled-repository-cleanup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audited cleanup
        run: python3 tool/controlled_repository_cleanup.py

      - name: Refresh dependency lockfile
        run: flutter pub get

      - name: Format modified Dart sources
        run: |
          dart format \
            lib/screens/compare_screen.dart \
            lib/screens/product_advanced_nba_tools_screen.dart \
            lib/screens/product_content_ops_screens.dart \
            lib/screens/product_python_dev_lab_screen.dart \
            lib/screens/product_shell_screens.dart

      - name: Wrap audited single-line flow controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('lib/screens/compare_screen.dart'),
              Path('lib/screens/product_advanced_nba_tools_screen.dart'),
              Path('lib/screens/product_content_ops_screens.dart'),
              Path('lib/screens/product_python_dev_lab_screen.dart'),
              Path('lib/screens/product_shell_screens.dart'),
          ]
          pattern = re.compile(r'^(\s*)if \((.+)\) (.+;)\s*$', re.MULTILINE)
          total = 0
          for path in files:
              text = path.read_text(encoding='utf-8')

              def wrap(match: re.Match[str]) -> str:
                  indent, condition, statement = match.groups()
                  return (
                      f'{indent}if ({condition}) {{\n'
                      f'{indent}  {statement}\n'
                      f'{indent}}}'
                  )

              updated, count = pattern.subn(wrap, text)
              total += count
              path.write_text(updated, encoding='utf-8')
              print(f'{path}: wrapped {count} single-line if statement(s)')

          if total != 8:
              raise SystemExit(
                  f'Expected exactly 8 audited single-line if statements; found {total}'
              )
          PY
          dart format \
            lib/screens/compare_screen.dart \
            lib/screens/product_advanced_nba_tools_screen.dart \
            lib/screens/product_content_ops_screens.dart \
            lib/screens/product_python_dev_lab_screen.dart \
            lib/screens/product_shell_screens.dart

      - name: Capture strict analyzer output
        id: analyzer
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee strict_analyzer.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload strict analyzer transcript
        uses: actions/upload-artifact@v4
        with:
          name: strict-analyzer-transcript
          path: strict_analyzer.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when strict analysis fails
        if: steps.analyzer.outputs.status != '0'
        run: exit 1

      - name: Run complete test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release

      - name: Commit validated cleanup
        shell: bash
        run: |
          rm .github/workflows/controlled_repository_cleanup.yml
          rm tool/controlled_repository_cleanup.py
          rm strict_analyzer.txt
          git config user.name "Sports Terminal Cleanup Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove unreachable code and normalize repository"
          git push origin HEAD:agent/controlled-repository-cleanup

      - name: Remove closed audit branches
        continue-on-error: true
        run: |
          git push origin --delete agent/validate-compile-repair || true
          git push origin --delete agent/repository-efficiency-audit || true
