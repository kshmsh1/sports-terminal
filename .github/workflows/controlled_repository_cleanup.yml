name: Controlled Repository Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Apply, validate, and commit audited cleanup
    if: github.head_ref == 'agent/controlled-repository-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/controlled-repository-cleanup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audited cleanup
        run: python3 tool/controlled_repository_cleanup.py

      - name: Refresh dependency lockfile
        run: flutter pub get

      - name: Format modified Dart sources
        run: |
          dart format \
            lib/screens/compare_screen.dart \
            lib/screens/product_advanced_nba_tools_screen.dart \
            lib/screens/product_content_ops_screens.dart \
            lib/screens/product_python_dev_lab_screen.dart \
            lib/screens/product_shell_screens.dart

      - name: Analyze cleaned repository
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test

      - name: Build release web application
        run: flutter build web --release

      - name: Commit validated cleanup
        shell: bash
        run: |
          rm .github/workflows/controlled_repository_cleanup.yml
          rm tool/controlled_repository_cleanup.py
          git config user.name "Sports Terminal Cleanup Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove unreachable code and normalize repository"
          git push origin HEAD:agent/controlled-repository-cleanup

      - name: Remove closed audit branches
        continue-on-error: true
        run: |
          git push origin --delete agent/validate-compile-repair || true
          git push origin --delete agent/repository-efficiency-audit || true
