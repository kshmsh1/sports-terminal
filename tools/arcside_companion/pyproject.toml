[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arcside-local-companion"
version = "0.1.0"
description = "Opt-in local Arcside IDE companion (no public execution service)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "debugpy>=1.8,<2",
]
[project.optional-dependencies]
ide = [
  "python-lsp-server[all]>=1.12,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "jupyter_client>=8,<9",
]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
arcside-companion = "arcside_companion.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arcside_companion*"]
